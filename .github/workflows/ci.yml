name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Verify package import
        run: python -c "import cafe_finder; print('cafe_finder imported from:', cafe_finder.__file__)"

      - name: Verify CLI entry points
        run: |
          cafe-finder-pipeline --help
          cafe-finder-search --help
          cafe-finder-quality --help
          cafe-finder-history --help
          cafe-finder-integrity --help
          cafe-finder-analyze --help
          cafe-finder-visualize --help
          cafe-finder-snapshot --help
          cafe-finder-lineage --help
          cafe-finder-compare --help

      - name: Verify test collection count
        run: |
          COLLECTION_OUTPUT=$(python -m pytest --collect-only -q 2>&1)
          echo "$COLLECTION_OUTPUT"
          TEST_COUNT=$(echo "$COLLECTION_OUTPUT" | grep -oP '\d+(?= tests)')
          echo "Tests collected: $TEST_COUNT"
          if [ "$TEST_COUNT" != "482" ]; then
            echo "ERROR: Expected 482 tests, got $TEST_COUNT"
            exit 1
          fi

      - name: Run test suite
        run: python -m pytest -q
